<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rave Cat Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<!--
  RAVE CAT CHAT — OBS Browser Source overlay
  ------------------------------------------------------------
  Add as a Browser Source (e.g. 1920x1080), transparent background is automatic.

  SETTINGS: in OBS, right-click this source → Interact, move the mouse over the overlay and
  click the gear in the bottom-right corner. Settings are saved in this browser source's local
  storage and applied when you press "Save & apply". (The panel is visible on stream while open.)
  With no chat source set, demo chat runs so you can see it working.

  Every setting can also be given as a URL parameter, which overrides the saved value — handy for
  running two copies with different setups. The panel's "Copy setup link" builds that link for you.
    channel, kick, tiktok (1 = TikFinity), youtube, ytkey, ytpoll, demo, size, bpm, linger, max, xmin, xmax,
    ground, hold, maxchars, cmds, firsttime, botlist, ignore, extemotes, pronouns, badges,
    ambient, sfx, sparks        (booleans take 1/0)

  Custom integrations (Streamer.bot, etc.) can also call:
    window.raveCats.say("name", "message", { color: "#ff00aa", platform: "twitch" })
-->
<style>
  :root{
    --ink:#111;
    --beat:.476s;
    --size:120px;
    --ground:6px;
  }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;}
  #stage{position:fixed;inset:0;pointer-events:none;font-family:'Comic Neue',system-ui,sans-serif;}

  /* ---------- ambient floor (only lit while cats are on stage) ---------- */
  #floor{position:absolute;inset:0;opacity:0;transition:opacity .7s ease}
  #stage.has-cats #floor{opacity:1}
  #ambient{
    position:absolute;left:0;right:0;bottom:0;height:90px;opacity:.22;
    background:
      radial-gradient(circle,rgba(255,255,255,.9) 1.3px,transparent 1.8px) 0 0/9px 9px,
      linear-gradient(90deg,#ff2bd6,#7a5cff,#00e5ff,#39ff88,#ffe600,#ff2bd6);
    background-size:9px 9px,300% 100%;
    -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 100%);
    mask-image:linear-gradient(to top,#000 0%,transparent 100%);
    animation:ambientShift 18s linear infinite, ambientPulse var(--beat) infinite ease-out;
  }
  @keyframes ambientShift{to{background-position:0 0,300% 0}}
  @keyframes ambientPulse{0%{opacity:.3}100%{opacity:.16}}

  /* ---------- cats ---------- */
  .cat{
    position:absolute;bottom:var(--ground);
    width:var(--size);height:calc(var(--size)*1.12);
    margin-left:calc(var(--size)*-.5);
    animation:catIn .7s cubic-bezier(.2,1.4,.4,1) both;
    z-index:5;
  }
  .cat.leaving{animation:catOut .8s cubic-bezier(.5,-.4,.8,.6) forwards;}
  @keyframes catIn{
    0%{transform:translateY(120%) scale(.5) rotate(-10deg);opacity:0}
    55%{transform:translateY(-14%) scale(1.08,.95) rotate(4deg);opacity:1}
    75%{transform:translateY(3%) scale(.97,1.04)}
    100%{transform:none}
  }
  @keyframes catOut{
    0%{transform:none;opacity:1}
    30%{transform:translateY(-22%) rotate(-8deg) scale(1.05)}
    100%{transform:translateY(140%) rotate(14deg) scale(.6);opacity:0}
  }

  .floorglow{
    position:absolute;left:-35%;width:170%;bottom:-14px;height:34px;border-radius:50%;
    background:radial-gradient(ellipse at center,var(--ga) 0%,transparent 70%);
    animation:floorPulse var(--beat) var(--sync) infinite ease-out;
  }
  @keyframes floorPulse{0%{transform:scale(1.15);opacity:1}100%{transform:scale(.85);opacity:.45}}

  .dancer{position:absolute;inset:0;transform-origin:50% 100%;
    animation-duration:var(--beat);animation-delay:var(--sync);
    animation-iteration-count:infinite;animation-timing-function:ease-in-out;}
  .d0{animation-name:bounce}
  .d1{animation-name:sway;animation-duration:calc(var(--beat)*2)}
  .d2{animation-name:hop}
  @keyframes bounce{
    0%,100%{transform:translateY(0) scale(1.07,.92)}
    50%{transform:translateY(calc(var(--size)*-.13)) scale(.95,1.06)}
  }
  @keyframes sway{
    0%,100%{transform:translateX(-5%) rotate(-7deg) scale(1.05,.93)}
    25%,75%{transform:translateY(calc(var(--size)*-.12)) scale(.96,1.05)}
    50%{transform:translateX(5%) rotate(7deg) scale(1.05,.93)}
  }
  @keyframes hop{
    0%,100%{transform:translateY(0) scale(1.1,.88)}
    35%{transform:translateY(calc(var(--size)*-.2)) scale(.93,1.08) rotate(-3deg)}
    65%{transform:translateY(0) scale(1.04,.96) rotate(2deg)}
  }

  .dancer svg{width:100%;height:100%;overflow:visible;display:block}
  #stage.sync .dancer svg{animation:syncSpin calc(var(--beat)*2) cubic-bezier(.4,0,.2,1)}
  @keyframes syncSpin{
    0%{transform:none}
    40%{transform:translateY(-30%) rotate(180deg) scale(1.1)}
    80%{transform:translateY(0) rotate(360deg) scale(.95,1.05)}
    100%{transform:rotate(360deg)}
  }

  .arm{animation:armPump var(--beat) var(--sync) infinite ease-in-out}
  .a1 .arm.R{animation-delay:calc(var(--sync) - var(--beat)/2)}
  .a2 .arm{animation-name:armWave;animation-duration:calc(var(--beat)*2)}
  .a2 .arm.R{animation-delay:calc(var(--sync) - var(--beat))}
  @keyframes armPump{0%,100%{transform:rotate(0)}50%{transform:rotate(calc(var(--dir)*30deg))}}
  @keyframes armWave{0%,100%{transform:rotate(calc(var(--dir)*-25deg))}50%{transform:rotate(calc(var(--dir)*55deg))}}

  .head{animation:headBob calc(var(--beat)*2) var(--sync) infinite ease-in-out}
  @keyframes headBob{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
  .talking .head{animation-duration:var(--beat)}

  .tail{animation:tailWag calc(var(--beat)*2) var(--sync) infinite ease-in-out}
  @keyframes tailWag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}

  .stick{fill:var(--g1);filter:drop-shadow(0 0 4px var(--g1)) drop-shadow(0 0 11px var(--g1));
    animation:flicker calc(var(--beat)/2) var(--sync) infinite alternate}
  .arm.R .stick{fill:var(--g2);filter:drop-shadow(0 0 4px var(--g2)) drop-shadow(0 0 11px var(--g2))}
  @keyframes flicker{from{opacity:1}to{opacity:.7}}

  .stick.bop2{fill:var(--g2);filter:drop-shadow(0 0 4px var(--g2)) drop-shadow(0 0 11px var(--g2))}
  .neon{stroke:var(--g1);filter:drop-shadow(0 0 4px var(--g1)) drop-shadow(0 0 9px var(--g1));
    animation:flicker calc(var(--beat)/2) var(--sync) infinite alternate}
  .lens{fill:var(--g1);animation:lens var(--beat) var(--sync) infinite steps(1)}
  .lens.l2{animation-delay:calc(var(--sync) - var(--beat)/2)}
  @keyframes lens{0%{fill:var(--g1)}50%{fill:var(--g2)}}

  .blink{animation:blink 4.3s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

  .mopen{opacity:0}
  .talking .mopen{animation:talk calc(var(--beat)/2) infinite alternate}
  .talking .mclosed{opacity:0}
  @keyframes talk{from{opacity:1;transform:scaleY(1)}to{opacity:1;transform:scaleY(.35)}}

  .cap i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);flex:none;display:inline-block}
  .cap i.twitch{background:#9146ff}
  .cap i.tiktok{background:linear-gradient(135deg,#25f4ee 50%,#fe2c55 50%)}
  .cap i.youtube{background:#ff0033}
  .cap i.kick{background:#53fc18}
  .cap i.custom{background:#fff}
  .cap span{white-space:nowrap;padding:0 2px}
  .cap .badges{display:inline-flex;gap:3px;align-items:center}
  .cap .badges img,.cap .badges svg{width:18px;height:18px;display:block}
  .cap .badges img{filter:drop-shadow(1px 0 0 var(--ink)) drop-shadow(-1px 0 0 var(--ink)) drop-shadow(0 1px 0 var(--ink)) drop-shadow(0 -1px 0 var(--ink))}

  /* ---------- speech bubbles ---------- */
  .bwrap{
    --shift:0px;--lift:0px;
    position:absolute;bottom:100%;left:50%;margin-bottom:20px;
    transform:translate(calc(-50% + var(--shift)),calc(-1 * var(--lift)));
    width:max-content;max-width:340px;
  }
  .bubble{
    --rad:22px;--bfill:#fff;
    position:relative;
    transform-origin:calc(50% - var(--shift)) calc(100% + 24px + var(--lift));
    animation:popIn .45s cubic-bezier(.2,1.6,.4,1) both, wobble 2.6s .45s ease-in-out infinite;
  }
  .bubble.out{animation:popOut .35s cubic-bezier(.6,-.5,.8,.5) forwards}
  @keyframes popIn{0%{transform:scale(0) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
  @keyframes popOut{0%{transform:none;opacity:1}40%{transform:scale(1.08)}100%{transform:scale(0) rotate(8deg);opacity:0}}
  @keyframes wobble{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg) translateY(-2px)}}

  /* bubble + pointer are one SVG path drawn behind the text */
  .bshape{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:0}
  .face{position:relative;z-index:1;padding:19px 19px 15px;box-sizing:border-box}
  .txt{font-size:20px;line-height:1.18;color:var(--ink);word-wrap:break-word;overflow-wrap:anywhere}
  .w{display:inline-block;opacity:0;transform:translateY(8px) scale(.5);
    animation:wIn .38s cubic-bezier(.3,1.7,.5,1) forwards;
    animation-delay:calc(var(--i) * 55ms + 180ms);}
  .fade .w{animation:wOut .55s ease-in forwards;animation-delay:calc(var(--i) * 45ms)}
  @keyframes wIn{to{opacity:1;transform:none}}
  @keyframes wOut{
    from{opacity:1;transform:none;filter:blur(0)}
    to{opacity:0;transform:translateY(-7px) scale(.85);filter:blur(3px)}
  }
  .w img{height:1.6em;vertical-align:-.42em}
  .w.em{position:relative}
  .w .zw{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
  .emoteonly .w img{height:2.6em}
  .w.giant img{height:4.4em}
  .w.gif{display:inline-block;margin:3px 0}
  .w.gif img{display:block;height:auto;max-height:150px;max-width:230px;border:3px solid var(--ink);border-radius:8px}
  .cap .pro{font:700 12px/1 'Comic Neue',sans-serif;letter-spacing:0;color:var(--ink);text-shadow:none;
    background:#fff;border:2px solid var(--ink);border-radius:5px;padding:2px 4px 1px;white-space:nowrap}

  .cap{
    position:absolute;top:-15px;left:10px;transform:rotate(-4deg);
    font:17px/1 'Bangers',sans-serif;letter-spacing:1px;white-space:nowrap;
    padding:3px 11px 2px 8px;border:3px solid var(--ink);background:var(--c);color:#fff;
    text-shadow:1.5px 1.5px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);
    display:flex;align-items:center;gap:5px;z-index:2;
  }


  /* shouting (ALL CAPS) */
  .shout{--rad:6px;animation:popIn .4s cubic-bezier(.2,1.8,.4,1) both, shake .18s .4s infinite}
  .shout .txt{font:26px/1.05 'Bangers',sans-serif;letter-spacing:1px}
  .shout{--bfill:#fff27a}
  @keyframes shake{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) translate(1px,-1px)}}

  /* /me actions */
  .action{--rad:3px}
  .action .txt{font-style:italic}
  .action{--bfill:var(--cl)}

  /* ---------- comic SFX bursts ---------- */
  .sfx{position:absolute;width:140px;height:110px;margin-left:-70px;z-index:20;
    animation:sfxIn 1.3s cubic-bezier(.2,1.5,.4,1) forwards}
  .sfx .rays{position:absolute;inset:-30px;border-radius:50%;
    background:repeating-conic-gradient(from 0deg,rgba(17,17,17,.55) 0 2deg,transparent 2deg 14deg);
    -webkit-mask-image:radial-gradient(circle,transparent 35%,#000 45%,transparent 70%);
    mask-image:radial-gradient(circle,transparent 35%,#000 45%,transparent 70%);
    animation:raySpin 1.3s linear}
  .sfx .star{position:absolute;inset:0;
    background:radial-gradient(circle,rgba(255,255,255,.6) 1.5px,transparent 2px) 0 0/6px 6px,var(--g1)}
  .sfx .star.back{background:var(--ink);transform:scale(1.12)}
  .sfx b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font:30px/1 'Bangers',sans-serif;letter-spacing:2px;color:#fff;transform:rotate(-8deg);
    -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
  @keyframes sfxIn{
    0%{transform:scale(0) rotate(-30deg);opacity:0}
    20%{transform:scale(1.15) rotate(6deg);opacity:1}
    35%{transform:scale(1) rotate(0)}
    75%{opacity:1}
    100%{transform:scale(.9) translateY(-30px);opacity:0}
  }
  @keyframes raySpin{to{transform:rotate(25deg) scale(1.3);opacity:0}}

  /* ---------- glowstick sparkles ---------- */
  .spark{position:absolute;width:12px;height:12px;margin-left:-6px;z-index:4;
    background:var(--sc);filter:drop-shadow(0 0 4px var(--sc));
    clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
    animation:sparkUp 1.5s ease-out forwards}
  @keyframes sparkUp{
    0%{transform:translate(0,0) scale(.3) rotate(0);opacity:0}
    15%{opacity:1;transform:translate(0,-8px) scale(1) rotate(30deg)}
    100%{transform:translate(var(--dx),-90px) scale(.2) rotate(200deg);opacity:0}
  }

  /* ---------- settings window (only visible while you interact with the source) ---------- */
  #gear{position:fixed;right:16px;bottom:16px;width:48px;height:48px;border-radius:50%;z-index:1000;
    border:3px solid var(--ink);background:#fff27a;box-shadow:4px 4px 0 var(--ink);cursor:pointer;
    display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .15s}
  body.mouse #gear{opacity:1;pointer-events:auto}
  #gear:hover{transform:rotate(30deg) scale(1.06)}
  #gear svg{width:26px;height:26px}
  #settings{position:fixed;inset:0;z-index:1001;display:none;align-items:center;justify-content:center;
    background:rgba(12,8,24,.55);pointer-events:auto;font:700 14px/1.3 'Comic Neue',system-ui,sans-serif;color:var(--ink)}
  #settings.open{display:flex}
  .sp{width:min(900px,94vw);max-height:92vh;display:flex;flex-direction:column;background:#fff;
    border:4px solid var(--ink);border-radius:16px;box-shadow:10px 10px 0 #ff2bd6;overflow:hidden}
  .sp-head{padding:14px 20px 10px;border-bottom:4px solid var(--ink);
    background:radial-gradient(circle,rgba(0,0,0,.12) 1.2px,transparent 1.7px) 0 0/8px 8px,#fff27a}
  .sp-head h2{margin:0;font:34px/1 'Bangers',sans-serif;letter-spacing:2px;transform:rotate(-1deg)}
  .sp-head p{margin:6px 0 0;font-size:13px}
  .sp-body{overflow:auto;padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .sp-sec{border:3px solid var(--ink);border-radius:12px;padding:10px 12px 12px;background:#fafaff;box-shadow:4px 4px 0 var(--ink)}
  .sp-sec h3{margin:-2px 0 8px;font:21px/1 'Bangers',sans-serif;letter-spacing:1.5px;color:#7a2cff}
  .sp-f{margin:0 0 10px}
  .sp-f:last-child{margin-bottom:0}
  .sp-f label{display:block;margin-bottom:3px}
  .sp-f input[type=text],.sp-f input[type=password],.sp-f input[type=number],.sp-f textarea{
    width:100%;box-sizing:border-box;font:600 14px 'Comic Neue',system-ui,sans-serif;padding:6px 8px;
    border:2.5px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
  .sp-f textarea{min-height:58px;resize:vertical}
  .sp-f input:focus,.sp-f textarea:focus{outline:3px solid #00e5ff;outline-offset:1px}
  .sp-f input:disabled,.sp-f textarea:disabled{background:#eee;color:#666}
  .sp-f small{display:block;margin-top:3px;font-weight:700;font-size:12px;color:#555}
  .sp-f small.url{color:#c2185b}
  .sp-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .sp-row label{margin:0}
  .sw{position:relative;width:46px;height:26px;flex:none}
  .sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
  .sw i{position:absolute;inset:0;border:2.5px solid var(--ink);border-radius:20px;background:#ddd;transition:background .15s}
  .sw i::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
    background:#fff;border:2px solid var(--ink);transition:transform .15s}
  .sw input:checked + i{background:#39ff88}
  .sw input:checked + i::after{transform:translateX(19px)}
  .sw input:disabled + i{opacity:.5}
  .sp-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px;border-top:4px solid var(--ink);background:#f3f0ff}
  .sp-foot .grow{flex:1}
  .sp-btn{font:19px/1 'Bangers',sans-serif;letter-spacing:1px;padding:8px 14px 7px;border:3px solid var(--ink);
    border-radius:10px;background:#fff;box-shadow:3px 3px 0 var(--ink);cursor:pointer;color:var(--ink)}
  .sp-btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .sp-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .sp-btn.go{background:#39ff88}
  .sp-btn.warn{background:#ffd0e4}
  .sp-msg{font-size:13px;color:#7a2cff;min-height:1em}
  .sp-link{width:100%;font:12px monospace;padding:6px;border:2px solid var(--ink);border-radius:6px;display:none}
</style>
</head>
<body>
<div id="stage"><div id="floor"><div id="ambient"></div></div></div>

<script>
(() => {
  // ---------------- settings (saved locally; URL parameters override) ----------------
  const STORE_KEY = 'raveCats.settings.v1';
  const FIELDS = [
    { sec: 'Chat sources' },
    { k: 'channel', label: 'Twitch channel', type: 'text', def: '', ph: 'yourchannel', help: 'Read anonymously, no login needed.' },
    { k: 'kick', label: 'Kick channel', type: 'text', def: '', ph: 'yourchannel', help: 'Read anonymously, no login needed.' },
    { k: 'tiktok', label: 'TikTok bridge', type: 'text', def: '', ph: '1 = TikFinity, or ws://…', help: 'TikTok needs a local bridge app. "1" uses TikFinity on this PC.' },
    { k: 'youtube', label: 'YouTube live', type: 'text', def: '', ph: 'video ID / link, or ws://…', help: 'A live video ID or link (needs the API key below), or a bridge address.' },
    { k: 'ytkey', label: 'YouTube API key', type: 'password', def: '', help: 'YouTube Data API v3 key from Google Cloud Console.' },
    { k: 'ytpoll', label: 'YouTube check every (s)', type: 'num', def: 6, min: 2, max: 60, step: 1, help: 'Lower = snappier, but uses the daily API quota faster.' },
    { k: 'demo', label: 'Demo chat', type: 'bool', def: false, help: 'Fake chatters. Also runs on its own when no source is set.' },
    { sec: 'Cats' },
    { k: 'size', label: 'Cat size (px)', type: 'num', def: 120, min: 50, max: 300, step: 5 },
    { k: 'bpm', label: 'Dance tempo (BPM)', type: 'num', def: 126, min: 40, max: 220, step: 1 },
    { k: 'max', label: 'Max cats on screen', type: 'num', def: 12, min: 1, max: 40, step: 1, help: 'Also limited by how many fit across.' },
    { k: 'linger', label: 'Stay after talking (s)', type: 'num', def: 0.6, min: 0, max: 15, step: 0.1 },
    { k: 'xmin', label: 'Stage left edge (%)', type: 'num', def: 0, min: 0, max: 100, step: 1 },
    { k: 'xmax', label: 'Stage right edge (%)', type: 'num', def: 100, min: 0, max: 100, step: 1, help: 'Keep cats out from under a facecam, etc.' },
    { k: 'ground', label: 'Distance from bottom (px)', type: 'num', def: 6, min: -40, max: 600, step: 1 },
    { sec: 'Speech bubbles' },
    { k: 'hold', label: 'Bubble time ×', type: 'num', def: 1, min: 0.3, max: 5, step: 0.1, help: 'Multiplier for how long messages stay up.' },
    { k: 'maxchars', label: 'Max message length', type: 'num', def: 150, min: 20, max: 500, step: 5 },
    { k: 'badges', label: 'Show badges', type: 'bool', def: true, help: 'Twitch and Kick badges; owner / mod / member / sub / follower badges on YouTube and TikTok.' },
    { k: 'pronouns', label: 'Show pronouns', type: 'bool', def: true, help: 'Twitch chatters who set them on pronouns.alejo.io.' },
    { k: 'extemotes', label: 'BTTV / FFZ / 7TV emotes', type: 'bool', def: true },
    { sec: 'Filtering' },
    { k: 'cmds', label: 'Show !commands', type: 'bool', def: false },
    { k: 'firsttime', label: 'Show first-time chatters', type: 'bool', def: false, help: 'Twitch flags these; spam bots usually show up this way.' },
    { k: 'botlist', label: 'Hide known bots', type: 'bool', def: true, help: 'Public TwitchInsights list (needs the overlay hosted, not a local file).' },
    { k: 'ignore', label: 'Always hide these users', type: 'area', def: 'nightbot, streamelements, streamlabs, moobot, fossabot, wizebot', help: 'Comma or line separated.' },
    { sec: 'Effects' },
    { k: 'ambient', label: 'Glowing dance floor', type: 'bool', def: true },
    { k: 'sfx', label: 'Comic POW! bursts', type: 'bool', def: true },
    { k: 'sparks', label: 'Glowstick sparkles', type: 'bool', def: true },
  ];
  const FIELD = Object.fromEntries(FIELDS.filter(f => f.k).map(f => [f.k, f]));
  const Q = new URLSearchParams(location.search);
  function coerce(f, v) {
    if (f.type === 'bool') return v === true || v === 1 || /^(1|true|yes|on)$/i.test(String(v));
    if (f.type === 'num') { const n = parseFloat(v); return isNaN(n) ? f.def : Math.min(f.max, Math.max(f.min, n)); }
    return String(v ?? '');
  }
  let saved = {}, storageOK = true;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { storageOK = false; }
  const fromURL = {};
  for (const f of Object.values(FIELD)) if (Q.has(f.k)) fromURL[f.k] = coerce(f, Q.get(f.k));
  const S = {};

    const n = Math.max(1, Math.min(CFG.max, Math.floor(span / (CFG.size * 1.15)) + 1));
    const old = slots;
    slots = Array.from({ length: n }, (_, i) => ({ x: n === 1 ? (x0 + x1) / 2 : x0 + span * i / (n - 1), cat: null }));
    // re-seat existing cats
    old.forEach(s => {
      if (!s.cat) return;
      const free = slots.find(z => !z.cat);
      if (free) { free.cat = s.cat; s.cat.slot = free; s.cat.el.style.left = free.x + 'px'; }
      else leave(s.cat);
    });
  }

  // A slot is only free once its previous cat has fully ducked away (busyUntil),
  // and slots still being vacated count as occupied when spreading cats out.
  const EXIT_MS = 950;
  const slotFree = (s, now) => !s.cat && now >= (s.busyUntil || 0);
  function pickSlot() {
    const now = Date.now();
    const free = slots.filter(s => slotFree(s, now));
    if (!free.length) return null;
    const taken = slots.filter(s => !slotFree(s, now));
    if (!taken.length) return free[Math.floor(Math.random() * free.length)];
    let best = null, bestD = -1;
    for (const s of free) {
      const d = Math.min(...taken.map(t => Math.abs(t.x - s.x))) + Math.random() * CFG.size * .5;
      if (d > bestD) { bestD = d; best = s; }
    }
    return best;
  }

  // ---------------- cat lifecycle ----------------
  function spawnCat(key, name, color, platform, slot) {
    const p = palette(name, color);
    const el = document.createElement('div');
    el.className = 'cat';
    el.style.left = slot.x + 'px';
    el.style.setProperty('--c', p.main);
    el.style.setProperty('--cd', p.dark);
    el.style.setProperty('--cl', p.light);
    el.style.setProperty('--dot', p.dot);
    el.style.setProperty('--g1', p.g1);
    el.style.setProperty('--g2', p.g2);
    el.style.setProperty('--ga', p.ga);
    el.style.setProperty('--sync', -((performance.now() / 1000) % (BEAT * 2)) + 's');

    const dance = p.seed >>> 10; // unsigned shift: a signed one went negative and picked a dance that doesn't exist
    el.innerHTML = `<div class="floorglow"></div>
      <div class="dancer d${dance % 3} a${(dance >>> 2) % 3}">${catSVG(p)}</div>`;
    stage.appendChild(el);

    const cat = { key, name, platform, el, p, slot, last: Date.now(), shownAt: Date.now(), speaking: false, queue: [], leaving: false };
    slot.cat = cat;
    cats.set(key, cat);
    stage.classList.add('has-cats');
    if (CFG.sfx) burst(slot.x, p);
    return cat;
  }

  function leave(cat) {
    if (cat.leaving) return;
    cat.leaving = true;
    cats.delete(cat.key);
    if (!cats.size) stage.classList.remove('has-cats');
    if (cat.slot && cat.slot.cat === cat) { cat.slot.cat = null; cat.slot.busyUntil = Date.now() + EXIT_MS; }
    cat.el.querySelectorAll('.bwrap').forEach(b => activeBubbles.delete(b));
    cat.el.classList.add('leaving');
    setTimeout(() => cat.el.remove(), 850);
  }


  // ---------------- comic SFX ----------------
  const SFX_WORDS = ['MEOW!', 'POW!', 'NYA!', 'ZAP!', 'BOOM!', 'WHAM!', 'PURR!', 'BAM!', 'MRRP!', 'KAPOW!'];
  const starPoly = (() => {
    const pts = [], n = 12;
    for (let i = 0; i < n * 2; i++) {
      const r = i % 2 ? 30 : 50, a = Math.PI * i / n;
      pts.push(`${50 + Math.cos(a) * r}% ${50 + Math.sin(a) * r}%`);
    }
    return `polygon(${pts.join(',')})`;
  })();

  function burst(x, p) {
    const el = document.createElement('div');
    el.className = 'sfx';
    el.style.left = (x + (Math.random() - .5) * CFG.size * .6) + 'px';
    el.style.bottom = (CFG.ground + CFG.size * .55) + 'px';
    el.style.setProperty('--g1', p.g1);
    el.innerHTML = `<div class="rays"></div><div class="star back"></div><div class="star"></div><b></b>`;
    el.querySelectorAll('.star').forEach(s => s.style.clipPath = starPoly);
    el.querySelector('b').textContent = SFX_WORDS[Math.floor(Math.random() * SFX_WORDS.length)];
    stage.appendChild(el);
    setTimeout(() => el.remove(), 1350);
  }

  // ---------------- sparkles ----------------
  if (CFG.sparks) setInterval(() => {
    if (!cats.size || document.querySelectorAll('.spark').length > 40) return;
    const list = [...cats.values()].filter(c => !c.leaving);
    if (!list.length) return;
    const c = list[Math.floor(Math.random() * list.length)];
    const left = Math.random() < .5;
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.left = (c.slot.x + (left ? -1 : 1) * CFG.size * .32) + 'px';
    s.style.bottom = (CFG.ground + CFG.size * .78) + 'px';
    s.style.setProperty('--sc', left ? c.p.g1 : c.p.g2);
    s.style.setProperty('--dx', ((Math.random() - .5) * 60) + 'px');
    stage.appendChild(s);
    setTimeout(() => s.remove(), 1550);
  }, 220);

  // ---------------- synchronized "drop" spin ----------------
  (function scheduleSync() {
    setTimeout(() => {
      if (cats.size >= 2) {
        stage.classList.add('sync');
        setTimeout(() => stage.classList.remove('sync'), BEAT * 2000 + 50);
      }
      scheduleSync();
    }, 30000 + Math.random() * 25000);
  })();

  // ---------------- speech ----------------
  function toWords(tokens) {
    const words = [];
    let chars = 0, cut = false;
    for (const t of tokens) {
      if (cut) break;
      if (t.t === 'emote' || t.t === 'gif') {
        const last = words[words.length - 1];
        if (t.zw && last && last.t === 'emote') { (last.over = last.over || []).push(t.url); continue; } // 7TV/BTTV zero-width
        words.push({ ...t }); chars += 2; continue;
      }
      for (const w of t.v.split(/\s+/).filter(Boolean)) {
        if (chars + w.length > CFG.maxChars) {
          const room = CFG.maxChars - chars;
          if (room > 3) words.push({ t: 'text', v: Array.from(w).slice(0, room).join('') + '…' });
          else words.push({ t: 'text', v: '…' });
          cut = true; break;
        }
        words.push({ t: 'text', v: w });
        chars += w.length + 1;
      }
    }
    return words;
  }

  function layoutBubble(wrap, cat) {
    const W = innerWidth;
    let shift = 0, lift = 0;
    wrap.style.setProperty('--shift', '0px');
    wrap.style.setProperty('--lift', '0px');
    let r = wrap.getBoundingClientRect();
    if (r.left < 10) shift = 10 - r.left;
    else if (r.right > W - 10) shift = (W - 10) - r.right;
    wrap.style.setProperty('--shift', shift + 'px');

    for (let k = 0; k < 6; k++) {
      r = wrap.getBoundingClientRect();
      let hit = null;
      for (const o of activeBubbles) {
        if (o === wrap) continue;
        const q = o.getBoundingClientRect();
        if (r.left < q.right + 8 && r.right > q.left - 8 && r.top < q.bottom + 18 && r.bottom > q.top - 8) { hit = q; break; }
      }
      if (!hit) break;
      lift += r.bottom - hit.top + 22;
      wrap.style.setProperty('--lift', lift + 'px');
    }
    cat.el.style.zIndex = lift > 0 ? 4 : 6;
    if (wrap._redraw) wrap._redraw();
    return { shift, lift };
  }

  // Bubble outline and pointer drawn as ONE continuous path, plus a halftone shadow copy.
  let shapeUid = 0;
  function makeShape(bubble, face, wrap, kind) {
    const ns = 'http://www.w3.org/2000/svg', id = 'bs' + (++shapeUid);
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'bshape');
    bubble.insertBefore(svg, face);
    const r = kind === 'shout' ? 7 : kind === 'action' ? 4 : 22;
    const fill = kind === 'shout' ? '#fff27a' : kind === 'action' ? 'var(--cl)' : '#fff';
    const dots = kind === 'shout' ? 'rgba(255,170,0,.35)' : 'var(--dot)';
    const draw = () => {
      const W = face.offsetWidth, H = face.offsetHeight;
      if (!W || !H) return;
      const shift = parseFloat(wrap.style.getPropertyValue('--shift')) || 0;
      const lift = parseFloat(wrap.style.getPropertyValue('--lift')) || 0;
      const th = 24 + lift;                 // pointer length (stretches when the bubble is lifted)
      const tip = W / 2 - shift;            // the cat's center, in bubble coordinates
      const bw = 26;                        // pointer base width
      let xl = tip - 7, xr = xl + bw;
      if (xr > W - r - 3) { xr = W - r - 3; xl = xr - bw; }
      if (xl < r + 3) { xl = r + 3; xr = xl + bw; }
      const d = `M${r} 0 H${W - r} A${r} ${r} 0 0 1 ${W} ${r} V${H - r} A${r} ${r} 0 0 1 ${W - r} ${H}`
              + ` H${xr} Q${xr - 5} ${H + th * .55} ${tip} ${H + th} Q${xl + 3} ${H + th * .45} ${xl} ${H}`
              + ` H${r} A${r} ${r} 0 0 1 0 ${H - r} V${r} A${r} ${r} 0 0 1 ${r} 0 Z`;
      svg.setAttribute('width', W);
      svg.setAttribute('height', H + th);
      svg.innerHTML = `<defs>
          <pattern id="${id}s" width="6" height="6" patternUnits="userSpaceOnUse">
            <rect width="6" height="6" style="fill:var(--c)"/><circle cx="3" cy="3" r="1.5" style="fill:var(--cd)"/>
          </pattern>
          <pattern id="${id}f" width="7" height="7" patternUnits="userSpaceOnUse">
            <rect width="7" height="7" style="fill:${fill}"/><circle cx="3.5" cy="3.5" r="1.25" style="fill:${dots}"/>
          </pattern>
        </defs>
        <path d="${d}" transform="translate(7 7)" fill="url(#${id}s)" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
        <path d="${d}" fill="url(#${id}f)" stroke="#111" stroke-width="4" stroke-linejoin="round"/>`;
    };
    draw();
    if (window.ResizeObserver) new ResizeObserver(draw).observe(face);
    wrap._redraw = draw; // redraw once web fonts load
  }

  function speak(cat, tokens, kind, badges = []) {
    if (cat.leaving) return;
    cat.last = Date.now();
    clearTimeout(cat.exitTimer);
    if (cat.speaking) {
      if (cat.queue.length < 3) cat.queue.push([tokens, kind, badges]);
      return;
    }
    const words = toWords(tokens);
    if (!words.length) { if (!cat.speaking) leave(cat); return; }
    cat.speaking = true;
    cat.el.classList.add('talking');

    const wrap = document.createElement('div');
    wrap.className = 'bwrap';
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (kind ? ' ' + kind : '');
    const face = document.createElement('div'); face.className = 'face';
    const txt = document.createElement('div'); txt.className = 'txt';
    // Shrink the text box to its widest line: browsers otherwise keep the full max width
    // after wrapping, leaving a blank strip on the right of the bubble.
    const fitText = () => {
      txt.style.width = '';
      let right = 0;
      for (const w of txt.children) right = Math.max(right, w.offsetLeft + w.offsetWidth);
      if (right) txt.style.width = Math.ceil(right - txt.offsetLeft + 1) + 'px';
    };
    const relayout = () => { if (wrap.isConnected) { fitText(); layoutBubble(wrap, cat); } };
    if (words.every(w => w.t === 'emote')) bubble.classList.add('emoteonly');
    words.forEach((w, i) => {
      const s = document.createElement('span');
      s.className = 'w';
      s.style.setProperty('--i', i);
      if (w.t === 'emote' || w.t === 'gif') {
        s.classList.add(w.t === 'gif' ? 'gif' : 'em');
        if (w.giant) s.classList.add('giant');
        const img = document.createElement('img');
        img.src = w.url; img.alt = w.code || '';
        img.onload = relayout;                       // images change the bubble size once loaded
        img.onerror = () => { s.textContent = w.code || ''; relayout(); };
        s.appendChild(img);
        (w.over || []).forEach(u => {
          const z = document.createElement('img'); z.src = u; z.className = 'zw'; z.alt = '';
          s.appendChild(z);
        });
      } else s.textContent = w.v;
      txt.appendChild(s);
      txt.appendChild(document.createTextNode(' '));
    });
    face.appendChild(txt);
    const cap = document.createElement('div'); cap.className = 'cap';
    const dot = document.createElement('i'); dot.className = cat.platform;
    const chars = Array.from(cat.name);
    const nm = document.createElement('span');
    nm.textContent = chars.length > 22 ? chars.slice(0, 21).join('') + '…' : cat.name;
    cap.append(dot);
    if (badges && badges.length) {
      const bw = document.createElement('span'); bw.className = 'badges';
      badges.slice(0, 5).forEach(b => { const el = badgeEl(b); if (el) bw.appendChild(el); });
      cap.appendChild(bw);
    }
    cap.append(nm);
    const fitCap = () => {
      const minW = Math.ceil(cap.offsetWidth + 24);
      face.style.minWidth = minW + 'px';
      wrap.style.maxWidth = Math.max(340, minW) + 'px';
    };
    const addPronouns = (txt) => {
      if (!txt || cap.querySelector('.pro')) return;
      const pr = document.createElement('span'); pr.className = 'pro'; pr.textContent = txt;
      cap.appendChild(pr);
      if (wrap.isConnected) { fitCap(); relayout(); }
    };
    if (cat.pronouns) addPronouns(cat.pronouns);
    else if (cat.pronP) cat.pronP.then(addPronouns);
    bubble.append(face, cap);
    wrap.appendChild(bubble);
    cat.el.appendChild(wrap);
    // widen the bubble if the name label is longer than the message, so the label never hangs off the side
    fitCap();
    fitText();
    activeBubbles.add(wrap);
    layoutBubble(wrap, cat);
    makeShape(bubble, face, wrap, kind);

    const textLen = words.reduce((n, w) => n + (w.t === 'text' ? w.v.length : w.t === 'gif' ? 12 : 3), 0);
    const reveal = words.length * 55 + 450;
    const hold = clamp(2200 + textLen * 55, 2500, 9000) * CFG.hold;

    setTimeout(() => {
      if (cat.leaving) return;
      bubble.classList.add('fade');
      setTimeout(() => {
        bubble.classList.add('out');
        setTimeout(() => {
          wrap.remove();
          activeBubbles.delete(wrap);
          cat.speaking = false;
          cat.el.classList.remove('talking');
          cat.last = Date.now();
          const next = cat.queue.shift();
          if (cat.leaving) return;
          if (next) setTimeout(() => speak(cat, next[0], next[1], next[2]), 150);
          else cat.exitTimer = setTimeout(() => leave(cat), CFG.linger); // only on screen while talking
        }, 360);
      }, words.length * 45 + 500);
    }, reveal + hold);
  }

  // ---------------- entry point for all chat sources ----------------
  function handleChat({ name, login, text, tokens, color, platform = 'custom', action = false, badges = [] }) {
    if (!name || hidden || Date.now() < quietUntil) return;
    const lower = name.toLowerCase();
    if (CFG.ignore.has(lower)) return;
    const plain = (text || '').trim();
    if (!CFG.cmds && plain.startsWith('!')) return;
    tokens = expandExtEmotes(tokens || [{ t: 'text', v: plain }]);
    if (!tokens.some(t => t.t !== 'text' || t.v.trim())) return;

    const letters = tokens.filter(t => t.t === 'text').map(t => t.v).join(' ').replace(/[^A-Za-z]/g, '');
    const kind = action ? 'action' : (letters.length >= 4 && letters === letters.toUpperCase() ? 'shout' : '');

    const key = platform + ':' + lower;
    const cat = cats.get(key);
    if (cat) { speak(cat, tokens, kind, badges); return; }
    const wait = pending.get(key);
    if (wait) { if (wait.msgs.length < 3) wait.msgs.push([tokens, kind, badges]); return; }
    const pronP = platform === 'twitch' && CFG.pronouns ? pronounsFor((login || name).toLowerCase()) : null;
    pending.set(key, { name, color, platform, pronP, msgs: [[tokens, kind, badges]], since: Date.now() });
    trySpawn(key);
  }

  // Chatters waiting for a free spot. A new cat never takes a spot that is occupied or
  // still being vacated; if the stage is full, the cat that has been up longest is asked
  // to leave (once it has had a few seconds on screen) and the newcomer waits for the spot.
  const pending = new Map();
  function trySpawn(key) {
    const w = pending.get(key);
    if (!w) return;
    const slot = pickSlot();
    if (slot) {
      pending.delete(key);
      const cat = spawnCat(key, w.name, w.color, w.platform, slot);
      if (w.pronP) { cat.pronP = w.pronP; w.pronP.then(t => { cat.pronouns = t; }); }
      const [first, ...rest] = w.msgs;
      cat.queue.push(...rest);
      setTimeout(() => speak(cat, first[0], first[1], first[2]), 450);
      return;
    }
    const now = Date.now();
    const vacating = slots.filter(s => !s.cat && now < (s.busyUntil || 0));
    let retry = 300;
    if (vacating.length) {
      retry = Math.min(...vacating.map(s => s.busyUntil - now)) + 20;
    } else if (vacating.length + pending.size > 0) {
      const live = [...cats.values()].filter(c => !c.leaving).sort((a, b) => a.shownAt - b.shownAt);
      const victim = live.find(c => !c.speaking) || live.find(c => now - c.shownAt > 3500);
      if (victim) { leave(victim); retry = EXIT_MS + 20; }
    }
    if (now - w.since > 20000) { pending.delete(key); return; } // give up on very stale messages
    setTimeout(() => trySpawn(key), retry);
  }

  window.raveCats = {
    say: (name, text, opts = {}) => handleChat({ name, text, color: opts.color, platform: opts.platform || 'custom' }),
    clear: () => [...cats.values()].forEach(leave),
  };

  // ---------------- hidden / shown ----------------
  // While the overlay is hidden (background tab, OBS source not visible) the browser throttles
  // timers, so bubbles freeze and everything waiting fires at once when it comes back. Instead,
  // chat is ignored while hidden and the stage starts fresh when it's shown again.
  let hidden = document.hidden, quietUntil = 0, shownAt = Date.now();
  function resetStage() {
    pending.clear();
    cats.forEach(c => { c.leaving = true; clearTimeout(c.exitTimer); });
    cats.clear();
    activeBubbles.clear();
    slots.forEach(s => { s.cat = null; s.busyUntil = 0; });
    stage.querySelectorAll('.cat, .sfx, .spark').forEach(el => el.remove());
    stage.classList.remove('has-cats', 'sync');
  }
  function setHidden(h) {
    if (h === hidden) return;
    hidden = h;
    resetStage();
    // throttled timers (demo, YouTube batches) flush right after the page wakes up; skip those
    if (!h) { shownAt = Date.now(); quietUntil = shownAt + 1000; }
  }
  document.addEventListener('visibilitychange', () => setHidden(document.hidden));
  addEventListener('obsSourceVisibleChanged', e => setHidden(!(e.detail && e.detail.visible)));

  // ---------------- Twitch (anonymous IRC over WebSocket) ----------------
  function parseTags(raw) {
    const o = {};
    const un = v => v.replace(/\\(.)/g, (_, c) => ({ s: ' ', ':': ';', '\\': '\\', r: '\r', n: '\n' }[c] ?? c));
    raw.split(';').forEach(kv => { const i = kv.indexOf('='); o[kv.slice(0, i)] = un(kv.slice(i + 1)); });
    return o;
  }
  // Native Twitch emotes (animated ones play automatically), chat GIFs (gifs tag) and
  // gigantified emotes (the Power-up makes the last emote in the message huge).
  function twitchTokens(msg, tags) {
    const chars = Array.from(msg);
    const ranges = [];
    (tags.emotes || '').split('/').forEach(e => {
      const [id, pos] = e.split(':');
      if (!pos) return;
      pos.split(',').forEach(p => { const [a, b] = p.split('-').map(Number); ranges.push({ kind: 'emote', id, a, b }); });
    });
    const gre = /(\d+)-(\d+)\|([^|]+)\|(.+?)(?=,\d+-\d+\||$)/g;
    let g;
    while ((g = gre.exec(tags.gifs || ''))) ranges.push({ kind: 'gif', a: +g[1], b: +g[2], id: g[3], url: g[4] });
    ranges.sort((x, y) => x.a - y.a);
    const giant = tags['msg-id'] === 'gigantified-emote-message';
    const lastEmote = giant ? [...ranges].reverse().find(r => r.kind === 'emote') : null;
    const out = []; let i = 0;
    for (const r of ranges) {
      if (r.a < i) continue;
      if (r.a > i) out.push({ t: 'text', v: chars.slice(i, r.a).join('') });
      const code = chars.slice(r.a, r.b + 1).join('');
      if (r.kind === 'gif') out.push({ t: 'gif', url: r.url, code: 'GIF' });
      else out.push({ t: 'emote', code, giant: r === lastEmote,
        url: `https://static-cdn.jtvnw.net/emoticons/v2/${r.id}/default/dark/${r === lastEmote ? '3.0' : '2.0'}` });
      i = r.b + 1;
    }
    if (i < chars.length) out.push({ t: 'text', v: chars.slice(i).join('') });
    return out;
  }

  // ---------------- badges ----------------
  // Twitch badge art comes from the public IVR API (global + channel, incl. sub-month badges).
  // If that's unreachable, the common global badges use Twitch's CDN directly, and anything
  // else falls back to a built-in comic badge. YouTube/TikTok send roles, not images, so they
  // use the built-in badges.
  const twBadges = { global: {}, channel: {} };
  const TW_BADGE_UUID = {
    broadcaster: '5527c58c-fb7d-422d-b71b-f309dcb85cc1', moderator: '3267646d-33f0-4b17-b3df-f923a41db1d0',
    vip: 'b817aba4-fad8-49e2-b88a-7cc744dfa6ec', subscriber: '5d9f2208-5dd8-11e7-8513-2ff4adfae661',
    founder: '511b78a9-ab37-472f-9569-457753bbe7d3', partner: 'd12a2e27-16f6-41d0-ab77-b780518f00a3',
    staff: 'd97c37bd-a6f5-4c38-8f57-4e4bef88af34', premium: 'bbbe0db0-a598-423e-86d0-f9fb98ca1933',
    turbo: 'bd444ec6-8f34-4bf9-91f4-af1e3428d80f', 'artist-badge': '4300a897-03dc-4e83-8c0e-c332fee7057f',
  };
  const TW_ROLE = { broadcaster: 'owner', moderator: 'mod', lead_moderator: 'mod', vip: 'vip', subscriber: 'sub',
    founder: 'founder', partner: 'verified', staff: 'staff', admin: 'staff', 'artist-badge': 'artist' };
  const ICONS = {
    owner:    { c: '#e91916', g: '<path d="M3 5.5h6.5v5H3z M9.5 7.6l3.3-2v4.8l-3.3-2z" fill="#fff"/>' },
    mod:      { c: '#00ad03', g: '<path d="M12.5 3.5l-6.3 6.3M4.5 8.6l2.9 2.9M5.3 10.7l-2 2" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>' },

  function iconSVG(role, label) {
    const ic = ICONS[role]; if (!ic) return null;

    return svg;
  }
  function badgeEl(b) {
    if (b.url) {

      img.src = b.url; img.alt = '';
      img.onerror = () => { const f = iconSVG(b.role); if (f) img.replaceWith(f); else img.remove(); };
      return img;
    }
    return iconSVG(b.role, b.label);
  }
  function fillBadges(dst, list) {
    const arr = Array.isArray(list) ? list : (list && (list.data || list.badges)) || [];
    arr.forEach(set => {
      const m = dst[set.set_id] = dst[set.set_id] || {};
      (set.versions || []).forEach(v => { m[v.id] = v.image_url_2x || v.image_url_1x || v.image_url_4x; });
    });
  }
  async function loadTwitchBadges(login) {
    await Promise.allSettled([
      getJSON('https://api.ivr.fi/v2/twitch/badges/global').then(j => fillBadges(twBadges.global, j)),
      login ? getJSON(`https://api.ivr.fi/v2/twitch/badges/channel?login=${encodeURIComponent(login)}`).then(j => fillBadges(twBadges.channel, j)) : null,
    ]);
  }
  function twitchBadges(tag) {
    if (!CFG.badges || !tag) return [];
    return tag.split(',').filter(Boolean).map(b => {
      const [set, ver] = b.split('/');
      const g = twBadges.global[set] || {}, c = twBadges.channel[set] || {};
      const url = c[ver] || g[ver] || (TW_BADGE_UUID[set] ? `https://static-cdn.jtvnw.net/badges/v1/${TW_BADGE_UUID[set]}/2` : null);
      return { url, role: TW_ROLE[set] };
    }).filter(b => b.url || b.role);
  }
  function roleBadges(d) {
    if (!CFG.badges || !d) return [];
    const out = [];
    if (d.isChatOwner || d.isOwner || d.isStreamer || d.isBroadcaster) out.push({ role: 'owner' });
    if (d.isChatModerator || d.isModerator || d.isMod) out.push({ role: 'mod' });
    if (d.isChatSponsor || d.isMember) out.push({ role: 'member' });
    if (d.isSubscriber) out.push({ role: 'sub' });
    if (d.isVerified) out.push({ role: 'verified' });
    if (d.followRole === 2) out.push({ role: 'friend' }); else if (d.followRole === 1) out.push({ role: 'follower' });
    if (d.topGifterRank >= 1 && d.topGifterRank <= 3) out.push({ role: 'gifter', label: String(d.topGifterRank) });
    const imgs = (Array.isArray(d.userBadges) ? d.userBadges : Array.isArray(d.badges) ? d.badges : [])
      .map(b => typeof b === 'string' ? b : b && (b.url || b.imageUrl || b.image)).filter(u => typeof u === 'string' && /^https?:/.test(u));
    imgs.slice(0, 2).forEach(url => out.push({ url }));
    return out;
  }

  // ---------------- BTTV / FFZ / 7TV emotes ----------------
  const extEmotes = new Map(); // code -> { url, zw }
  const BTTV_ZW = new Set(['SoSnowy', 'IceCold', 'SantaHat', 'TopHat', 'ReinDeer', 'CandyCane', 'cvMask', 'cvHazmat']);
  let twitchRoomId = '', kickUserId = '';
  async function getJSON(u) { const r = await fetch(u); if (!r.ok) throw new Error(r.status + ' ' + u); return r.json(); }
  async function loadExtEmotes() {
    const next = new Map();
    const add = (code, url, zw = false) => { if (code && url) next.set(code, { url, zw }); };
    const bttv = (l) => (l || []).forEach(e => add(e.code, `https://cdn.betterttv.net/emote/${e.id}/2x`, BTTV_ZW.has(e.code)));
    const ffz = (l) => (l || []).forEach(e => e.images && add(e.code, e.images['2x'] || e.images['1x']));
    const stv = (l) => (l || []).forEach(e => {
      const host = e.data && e.data.host;
      if (!host || !host.url) return;
      const files = host.files || [];
      const f = files.find(x => x.name === '2x.webp') || files.find(x => /2x/.test(x.name)) || files[0];
      const zw = ((e.flags || 0) & 1) || ((e.data.flags || 0) & 256);
      add(e.name, (host.url.startsWith('//') ? 'https:' : '') + host.url + '/' + (f ? f.name : '2x.webp'), !!zw);
    });
    // globals first so channel emotes with the same name win
    await Promise.allSettled([
      getJSON('https://api.betterttv.net/3/cached/emotes/global').then(bttv),
      getJSON('https://api.betterttv.net/3/cached/frankerfacez/emotes/global').then(ffz),
      getJSON('https://7tv.io/v3/emote-sets/global').then(set => stv(set.emotes)),
    ]);
    if (twitchRoomId) await Promise.allSettled([
      getJSON(`https://api.betterttv.net/3/cached/users/twitch/${twitchRoomId}`).then(u => bttv([...(u.channelEmotes || []), ...(u.sharedEmotes || [])])),
      getJSON(`https://api.betterttv.net/3/cached/frankerfacez/users/twitch/${twitchRoomId}`).then(ffz),
      getJSON(`https://7tv.io/v3/users/twitch/${twitchRoomId}`).then(u => stv(u.emote_set && u.emote_set.emotes)),
    ]);
    if (kickUserId) await getJSON(`https://7tv.io/v3/users/kick/${kickUserId}`).then(u => stv(u.emote_set && u.emote_set.emotes)).catch(() => {});
    if (next.size) { extEmotes.clear(); next.forEach((v, k) => extEmotes.set(k, v)); }
    console.log('[raveCats] loaded', extEmotes.size, 'BTTV/FFZ/7TV emotes');
  }
  function expandExtEmotes(tokens) {
    if (!extEmotes.size) return tokens;
    const out = [];
    for (const t of tokens) {
      if (t.t !== 'text') { out.push(t); continue; }
      let buf = '';
      for (const part of t.v.split(/(\s+)/)) {
        const e = part && extEmotes.get(part);
        if (e) { if (buf) out.push({ t: 'text', v: buf }); buf = ''; out.push({ t: 'emote', code: part, url: e.url, zw: e.zw }); }
        else buf += part;
      }
      if (buf) out.push({ t: 'text', v: buf });
    }
    return out;
  }

  // ---------------- pronouns (pronouns.alejo.io, Twitch only) ----------------
  const pronounDefs = {};
  const pronounCache = new Map();
  let pronounDefsP = null;
  function pronounsFor(login) {
    if (pronounCache.has(login)) return pronounCache.get(login);
    pronounDefsP = pronounDefsP || getJSON('https://api.pronouns.alejo.io/v1/pronouns').then(j => Object.assign(pronounDefs, j)).catch(() => {});
    const pr = (async () => {
      try {
        const r = await fetch(`https://api.pronouns.alejo.io/v1/users/${encodeURIComponent(login)}`);
        if (!r.ok) return '';
        const u = await r.json();
        await pronounDefsP;
        const a = pronounDefs[u.pronoun_id], b = u.alt_pronoun_id && pronounDefs[u.alt_pronoun_id];
        if (!a) return '';
        return (b ? `${a.subject}/${b.subject}` : a.singular ? a.subject : `${a.subject}/${a.object}`).toLowerCase();
      } catch { return ''; }
    })();
    pronounCache.set(login, pr);
    if (pronounCache.size > 2000) pronounCache.delete(pronounCache.keys().next().value);
    return pr;
  }

  function connectTwitch(channel) {
    const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    ws.onopen = () => {
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      ws.send('PASS SCHMOOPIIE');
      ws.send('NICK justinfan' + Math.floor(10000 + Math.random() * 80000));
      ws.send('JOIN #' + channel);
    };
    ws.onmessage = (ev) => {
      ev.data.split('\r\n').forEach(line => {
        if (!line) return;
        if (line.startsWith('PING')) { ws.send('PONG :tmi.twitch.tv'); return; }
        const m = /^(?:@(\S+) )?:([^!\s]+)![^ ]+ PRIVMSG #\S+ :(.*)$/.exec(line);
        if (m) {
          const tags = m[1] ? parseTags(m[1]) : {};
          if (tags['first-msg'] === '1' && !CFG.firsttime) return;
          let msg = m[3], action = false;
          const act = /^\u0001ACTION (.*)\u0001$/.exec(msg);
          if (act) { msg = act[1]; action = true; }
          handleChat({
            name: tags['display-name'] || m[2],
            text: msg,
            login: m[2],
            badges: twitchBadges(tags.badges),
            tokens: twitchTokens(msg, tags),
            color: tags.color,
            platform: 'twitch',
            action,
          });
          return;
        }
        const rs = /^@(\S+) :tmi\.twitch\.tv ROOMSTATE /.exec(line);
        if (rs) {
          const id = parseTags(rs[1])['room-id'];
          if (id && id !== twitchRoomId) { twitchRoomId = id; if (CFG.extemotes) loadExtEmotes(); }
          return;
        }
        const cc = /CLEARCHAT #\S+ :(\S+)$/.exec(line);
        if (cc) { const c = cats.get('twitch:' + cc[1].toLowerCase()); if (c) leave(c); }
      });
    };
    ws.onclose = () => setTimeout(() => connectTwitch(channel), 3000);
  }

  // ---------------- WebSocket bridges (TikFinity for TikTok, or any bridge for YouTube) ----------------
  function connectBridge(url, platform) {
    let ws;
    try { ws = new WebSocket(url); } catch (e) { return setTimeout(() => connectBridge(url, platform), 5000); }
    ws.onmessage = (ev) => {
      let o; try { o = JSON.parse(ev.data); } catch { return; }
      const type = (o.event || o.type || '').toString().toLowerCase();
      if (type && !['chat', 'comment', 'message', 'chatmessage'].includes(type)) return;
      const d = o.data || o;
      const name = d.nickname || d.uniqueId || d.displayName || d.chatname ||
                   (d.user && (d.user.nickname || d.user.uniqueId || d.user.name)) || d.username;
      const text = d.comment || d.message || d.text || d.chatmessage;
      if (name && typeof text === 'string') handleChat({ name, text, color: d.color, platform, tokens: bridgeTokens(text, d.emotes), badges: roleBadges(d) });
    };
    ws.onclose = () => setTimeout(() => connectBridge(url, platform), 3000);
    ws.onerror = () => {};
  }

  // TikTok subscriber emotes arrive as [{ emoteImageUrl, placeInComment }]; other bridges may send
  // [{ name|code, url|imageUrl }] to swap by name.
  function bridgeTokens(text, emotes) {
    if (!Array.isArray(emotes) || !emotes.length) return null;
    const placed = emotes.filter(e => e && (e.emoteImageUrl || e.url || e.imageUrl) && Number.isInteger(e.placeInComment))
                         .sort((a, b) => a.placeInComment - b.placeInComment);
    if (placed.length) {
      const chars = Array.from(text), out = []; let i = 0;
      for (const e of placed) {
        const at = Math.min(e.placeInComment, chars.length);
        if (at > i) out.push({ t: 'text', v: chars.slice(i, at).join('') });
        out.push({ t: 'emote', url: e.emoteImageUrl || e.url || e.imageUrl });
        i = at;
      }
      if (i < chars.length) out.push({ t: 'text', v: chars.slice(i).join('') });
      return out;
    }
    const named = new Map(emotes.filter(e => e && (e.name || e.code) && (e.url || e.imageUrl)).map(e => [e.name || e.code, e.url || e.imageUrl]));
    if (!named.size) return null;
    return text.split(/(\s+)/).filter(Boolean).map(w => named.has(w) ? { t: 'emote', code: w, url: named.get(w) } : { t: 'text', v: w });
  }

  // ---------------- YouTube (Data API v3 polling) ----------------
  async function connectYouTube(videoId, key) {
    const API = 'https://www.googleapis.com/youtube/v3/';
    const retry = () => setTimeout(() => connectYouTube(videoId, key), 30000);
    let chatId;
    try {
      const r = await fetch(`${API}videos?part=liveStreamingDetails&id=${encodeURIComponent(videoId)}&key=${encodeURIComponent(key)}`);
      const j = await r.json();
      chatId = j.items && j.items[0] && j.items[0].liveStreamingDetails && j.items[0].liveStreamingDetails.activeLiveChatId;
      if (!chatId) { console.warn('[raveCats] YouTube: no active live chat for', videoId, j.error || ''); return retry(); }
    } catch (e) { console.warn('[raveCats] YouTube lookup failed', e); return retry(); }

    let pageToken = '', first = true;
    const poll = async () => {
      let wait = CFG.ytpoll;
      try {
        const r = await fetch(`${API}liveChat/messages?liveChatId=${encodeURIComponent(chatId)}&part=snippet,authorDetails&maxResults=200&key=${encodeURIComponent(key)}${pageToken ? '&pageToken=' + pageToken : ''}`);
        const j = await r.json();
        if (j.error) {
          console.warn('[raveCats] YouTube:', j.error.message);
          if (r.status === 403 || r.status === 404) return retry(); // chat ended or quota hit
          wait = 15000;
        } else {
          pageToken = j.nextPageToken || pageToken;
          wait = Math.max(CFG.ytpoll, j.pollingIntervalMillis || 0);
          if (!first) {
            // spread a batch out over the poll window so cats don't all talk at once
            // (and drop anything sent while the overlay was hidden)
            const items = (j.items || []).filter(it => it.snippet && it.snippet.displayMessage && !(Date.parse(it.snippet.publishedAt) < shownAt));
            items.forEach((it, i) => setTimeout(() => handleChat({
              name: it.authorDetails.displayName,
              text: it.snippet.displayMessage,
              platform: 'youtube',
              badges: roleBadges(it.authorDetails),
            }), (i / Math.max(1, items.length)) * wait * .8));
          }
          first = false; // skip backlog on connect
        }
      } catch (e) { wait = 15000; }
      setTimeout(poll, wait);
    };
    poll();
  }

  // ---------------- Kick (anonymous, Kick's public Pusher chat socket) ----------------
  const KICK_PUSHER = 'wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=8.4.0&flash=false';
  const KICK_ROLE = { broadcaster: 'owner', moderator: 'mod', vip: 'vip', og: 'founder', founder: 'founder',
    subscriber: 'sub', verified: 'verified', staff: 'staff', sub_gifter: 'gifter' };
  let kickSubBadges = []; // [{ months, url }], longest first
  async function connectKick(slug) {
    let chatroom;
    try {
      const ch = await getJSON(`https://kick.com/api/v2/channels/${encodeURIComponent(slug)}`);
      chatroom = ch.chatroom && ch.chatroom.id;
      if (!chatroom) throw new Error('no chatroom');
      kickSubBadges = (ch.subscriber_badges || []).map(b => ({ months: b.months, url: b.badge_image && b.badge_image.src }))
        .filter(b => b.url).sort((a, b) => b.months - a.months);
      if (ch.user_id && String(ch.user_id) !== kickUserId) { kickUserId = String(ch.user_id); if (CFG.extemotes) loadExtEmotes(); }
    } catch (e) { console.warn('[raveCats] Kick channel lookup failed for', slug, e); return setTimeout(() => connectKick(slug), 30000); }
    kickSocket(chatroom);
  }
  function kickSocket(chatroom) {
    const ws = new WebSocket(KICK_PUSHER);
    ws.onmessage = (ev) => {
      let o; try { o = JSON.parse(ev.data); } catch { return; }
      if (o.event === 'pusher:connection_established') {
        ws.send(JSON.stringify({ event: 'pusher:subscribe', data: { auth: '', channel: `chatrooms.${chatroom}.v2` } }));
        return;
      }
      if (o.event === 'pusher:ping') { ws.send(JSON.stringify({ event: 'pusher:pong', data: {} })); return; }
      let d; try { d = typeof o.data === 'string' ? JSON.parse(o.data) : o.data; } catch { return; }
      if (!d) return;
      if (o.event === 'App\\Events\\ChatMessageEvent') {
        const s = d.sender || {};
        handleChat({
          name: s.username,
          text: (d.content || '').replace(/\[emote:\d+:([^\]]+)\]/g, '$1'),
          tokens: kickTokens(d.content || ''),
          color: s.identity && s.identity.color,
          platform: 'kick',
          badges: kickBadges(s.identity && s.identity.badges),
        });
      } else if (o.event === 'App\\Events\\UserBannedEvent') {
        const u = d.user && d.user.username;
        const c = u && cats.get('kick:' + u.toLowerCase()); if (c) leave(c);
      }
    };
    ws.onclose = () => setTimeout(() => kickSocket(chatroom), 3000);
    ws.onerror = () => {};
  }
  // Kick emotes arrive inline as [emote:ID:name]
  function kickTokens(content) {
    const out = [], re = /\[emote:(\d+):([^\]]+)\]/g;
    let m, i = 0;
    while ((m = re.exec(content))) {
      if (m.index > i) out.push({ t: 'text', v: content.slice(i, m.index) });
      out.push({ t: 'emote', code: m[2], url: `https://files.kick.com/emotes/${m[1]}/fullsize` });
      i = re.lastIndex;
    }
    if (i < content.length) out.push({ t: 'text', v: content.slice(i) });
    return out;
  }
  function kickBadges(list) {
    if (!CFG.badges || !Array.isArray(list)) return [];
    return list.map(b => {
      const role = KICK_ROLE[b.type];
      if (b.type === 'subscriber') {
        const sb = kickSubBadges.find(x => x.months <= (b.count || 1)) || kickSubBadges[kickSubBadges.length - 1];
        if (sb) return { url: sb.url, role };
      }
      return role ? { role } : null;
    }).filter(Boolean);
  }

  // Adds ~1k known bot accounts to the ignore list. If the site can't be reached (offline,

  async function loadBotList() {
    try {

      const j = await r.json();
      let n = 0;

    const gear = document.createElement('button');
    gear.id = 'gear'; gear.title = 'Rave Cat settings';
    gear.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm9 3.5-2.2-.8a7 7 0 0 0-.6-1.5l1-2.1-1.8-1.8-2.1 1a7 7 0 0 0-1.5-.6L13 2h-2l-.8 2.2a7 7 0 0 0-1.5.6l-2.1-1-1.8 1.8 1 2.1a7 7 0 0 0-.6 1.5L3 11v2l2.2.8c.1.5.3 1 .6 1.5l-1 2.1 1.8 1.8 2.1-1c.5.3 1 .5 1.5.6L11 22h2l.8-2.2a7 7 0 0 0 1.5-.6l2.1 1 1.8-1.8-1-2.1c.3-.5.5-1 .6-1.5L21 13z" fill="#111"/></svg>';
    document.body.appendChild(gear);

    const panel = document.createElement('div');
    panel.id = 'settings';
    panel.innerHTML = `<div class="sp" role="dialog" aria-label="Rave Cat settings">
      <div class="sp-head"><h2>Rave Cat Chat — Settings</h2>
        <p>Saved in this browser source and applied when you press <b>Save &amp; apply</b>. Heads up: this window shows on stream while it's open.</p></div>
      <div class="sp-body"></div>
      <div class="sp-foot">
        <button class="sp-btn" data-act="test">Test message</button>
        <button class="sp-btn" data-act="link">Copy setup link</button>
        <button class="sp-btn warn" data-act="reset">Reset</button>
        <span class="sp-msg grow"></span>
        <button class="sp-btn" data-act="close">Cancel</button>
        <button class="sp-btn go" data-act="save">Save &amp; apply</button>
        <input class="sp-link" readonly>
      </div></div>`;
    document.body.appendChild(panel);
    const body = panel.querySelector('.sp-body'), msg = panel.querySelector('.sp-msg'), linkBox = panel.querySelector('.sp-link');
    const inputs = {};

    let sec = null;
    for (const f of FIELDS) {
      if (f.sec) {
        sec = document.createElement('div'); sec.className = 'sp-sec';
        const h = document.createElement('h3'); h.textContent = f.sec; sec.appendChild(h);
        body.appendChild(sec); continue;
      }
      const wrapF = document.createElement('div'); wrapF.className = 'sp-f';
      const id = 'sp-' + f.k;
      const lab = document.createElement('label'); lab.htmlFor = id; lab.textContent = f.label;
      let inp;
      if (f.type === 'bool') {
        const row = document.createElement('div'); row.className = 'sp-row';
        const sw = document.createElement('span'); sw.className = 'sw';
        inp = document.createElement('input'); inp.type = 'checkbox';
        sw.append(inp, document.createElement('i'));
        row.append(lab, sw); wrapF.appendChild(row);
      } else {
        inp = document.createElement(f.type === 'area' ? 'textarea' : 'input');
        if (f.type !== 'area') inp.type = f.type === 'num' ? 'number' : f.type;
        if (f.type === 'num') { inp.min = f.min; inp.max = f.max; inp.step = f.step; }
        if (f.ph) inp.placeholder = f.ph;
        inp.spellcheck = false; inp.autocomplete = 'off';
        wrapF.append(lab, inp);
      }
      inp.id = id;
      if (f.help) { const sm = document.createElement('small'); sm.textContent = f.help; wrapF.appendChild(sm); }
      if (f.k in fromURL) {
        inp.disabled = true;
        const sm = document.createElement('small'); sm.className = 'url';
        sm.textContent = 'Set by the source URL, which overrides this.';
        wrapF.appendChild(sm);
      }
      inputs[f.k] = inp;
      sec.appendChild(wrapF);
    }

    const fill = (vals) => {
      for (const [k, inp] of Object.entries(inputs)) {
        const v = vals[k];
        if (FIELD[k].type === 'bool') inp.checked = !!v; else inp.value = v;
      }
    };
    const read = () => {
      const out = {};
      for (const [k, inp] of Object.entries(inputs)) {
        const f = FIELD[k];
        out[k] = coerce(f, f.type === 'bool' ? inp.checked : inp.value);
      }
      return out;
    };
    const open = () => { fill(S); msg.textContent = storageOK ? '' : 'This browser source can\'t save settings — use "Copy setup link" instead.'; linkBox.style.display = 'none'; panel.classList.add('open'); };
    const close = () => panel.classList.remove('open');

    gear.addEventListener('click', open);
    panel.addEventListener('mousedown', e => { if (e.target === panel) close(); });
    addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

    panel.querySelector('.sp-foot').addEventListener('click', e => {
      const act = e.target.dataset && e.target.dataset.act;
      if (!act) return;
      if (act === 'close') close();
      if (act === 'test') {
        const n = ['TestKitty', 'SettingsCat', 'PreviewPurr', 'DemoMeow'][Math.floor(Math.random() * 4)];
        window.raveCats.say(n, 'This is how chat will look! 🎶', { platform: CFG.channel ? 'twitch' : CFG.kick ? 'kick' : CFG.youtube ? 'youtube' : CFG.tiktok ? 'tiktok' : 'custom' });
        msg.textContent = 'Sent a test message (uses the settings currently running).';
      }
      if (act === 'reset') {
        const d = {}; for (const f of Object.values(FIELD)) d[f.k] = f.def;
        fill(d); msg.textContent = 'Defaults filled in — press Save & apply to keep them.';
      }
      if (act === 'link') {
        const vals = read(), q = new URLSearchParams();
        for (const f of Object.values(FIELD)) {
          const v = vals[f.k];
          if (v === f.def) continue;
          q.set(f.k, f.type === 'bool' ? (v ? '1' : '0') : String(v));
        }
        const link = location.href.split(/[?#]/)[0] + (q.toString() ? '?' + q.toString() : '');
        linkBox.value = link; linkBox.style.display = 'block'; linkBox.select();
        const done = () => { msg.textContent = 'Setup link copied' + (vals.ytkey ? ' (it includes your YouTube API key — keep it private).' : '.'); };
        try { navigator.clipboard.writeText(link).then(done, () => { document.execCommand('copy'); done(); }); }
        catch (err) { try { document.execCommand('copy'); done(); } catch (e2) { msg.textContent = 'Copy the link from the box below.'; } }
      }
      if (act === 'save') {
        try {
          const vals = read();
          // fields locked by the URL keep whatever was saved before (the URL value isn't a choice made here)
          for (const k in fromURL) { if (k in saved) vals[k] = coerce(FIELD[k], saved[k]); else delete vals[k]; }
          localStorage.setItem(STORE_KEY, JSON.stringify(vals));
          msg.textContent = 'Saved! Reloading…';
          setTimeout(() => location.reload(), 250);
        } catch (err) {
          msg.textContent = 'Couldn\'t save here — use "Copy setup link" and paste it as the source URL.';
        }
      }
    });

    // gear only appears while a mouse is over the overlay (i.e. in OBS's Interact window)
    let mt;
    addEventListener('mousemove', () => {
      document.body.classList.add('mouse');
      clearTimeout(mt); mt = setTimeout(() => document.body.classList.remove('mouse'), 3000);
    });
    document.addEventListener('mouseleave', () => document.body.classList.remove('mouse'));
  })();

  // ---------------- boot ----------------
  if (CFG.botlist) loadBotList();
  if (CFG.extemotes) {
    loadExtEmotes();
    setInterval(loadExtEmotes, 10 * 60 * 1000);
  }
  buildSlots();
  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(buildSlots, 200); });
  if (CFG.channel) connectTwitch(CFG.channel);
  if (CFG.badges && CFG.channel) loadTwitchBadges(CFG.channel);
  if (CFG.kick) connectKick(CFG.kick);
  if (CFG.tiktok) connectBridge(CFG.tiktok, 'tiktok');
  if (CFG.youtube) {
    if (/^wss?:\/\//i.test(CFG.youtube)) connectBridge(CFG.youtube, 'youtube');
    else if (CFG.ytkey) connectYouTube(CFG.youtube.replace(/^.*(?:v=|youtu\.be\/|live\/)([\w-]{11}).*$/, '$1'), CFG.ytkey);
    else console.warn('[raveCats] youtube= needs ytkey= (or a ws:// bridge URL)');
  }
  if (CFG.demo) runDemo();
})();
</script>
</body>
</html>
